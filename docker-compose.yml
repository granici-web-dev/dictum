services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dictum
      POSTGRES_PASSWORD: dictum
      POSTGRES_DB: dictum
    # 5434 снаружи: 5432 и 5433 на машине разработчика заняты Postgres другого проекта, и
    # `make up` падал на «port is already allocated».
    ports: ["5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
